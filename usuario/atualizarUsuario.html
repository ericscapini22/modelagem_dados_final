<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atualizar - Usuário</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="atualizarUsuario.js" defer></script>
</head>

<body>
  <label for="id_usuario">ID do Usuário:</label>
  <input type="number" id="id_usuario" placeholder="Digite o ID do usuário">

  <label for="nm_usuario">Nome:</label>
  <input type="text" id="nm_usuario" placeholder="Digite o nome">

  <label for="sobrenome">Sobrenome:</label>
  <input type="text" id="sobrenome" placeholder="Digite o sobrenome">

  <label for="idade">Idade:</label>
  <input type="number" id="idade" placeholder="Digite a idade">

  <label for="email">E-mail:</label>
  <input type="email" id="email" placeholder="Digite o e-mail">

  <label for="telefone">Telefone:</label>
  <input type="text" id="telefone" placeholder="Digite o telefone">

  <label for="endereco">Endereço:</label>
  <input type="text" id="endereco" placeholder="Digite o endereço">

  <label for="cidade">Cidade:</label>
  <input type="text" id="cidade" placeholder="Digite a cidade">

  <label for="estado">Estado:</label>
  <input type="text" id="estado" placeholder="Digite o estado">

  <label for="dataNascimento">Data de Nascimento:</label>
  <input type="date" id="dataNascimento" placeholder="Selecione a data de nascimento">
  <br> 
  <button id="btnAtualizar">Atualizar Usuário</button>
  
  <div id="res"></div>
</body>

</html>
