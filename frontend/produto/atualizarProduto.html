<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar - Produto</title>
    <link rel="stylesheet" href="../style.css" />
    <script src="atualizarProduto.js" defer></script>
</head>

<body>
    <label for="id_produto">ID do Produto:</label>
    <input type="number" id="id_produto" placeholder="Digite o id do Produto">

    <label for="nm_produto">Nome do Produto:</label>
    <input type="text" id="nm_produto" placeholder="Digite o nome do produto">

    <label for="descricao">Descrição:</label>
    <input type="text" id="descricao" placeholder="Digite a descrição do produto">

    <label for="categoria">Categoria:</label>
    <input type="text" id="categoria" placeholder="Digite a categoria">

    <label for="preco">Preço (R$):</label>
    <input type="number" step="0.01" id="preco" placeholder="Digite o preço do produto">

    <label for="porcentagemDesconto">Desconto (%):</label>
    <input type="number" id="porcentagemDesconto" placeholder="Digite o desconto em porcentagem">

    <label for="estoque">Estoque:</label>
    <input type="number" id="estoque" placeholder="Digite a quantidade em estoque">

    <label for="marca">Marca:</label>
    <input type="text" id="marca" placeholder="Digite a marca do produto">

    <label for="ft_produto">URL da Imagem do Produto:</label>
    <input type="url" id="ft_produto" placeholder="Cole aqui o link da imagem">

    <button id="btnAtualizar">Atualizar Produto</button>

    <div id="res"></div>
</body>

</html>
