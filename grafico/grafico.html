<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <h2>Gráfico por intervalo de ID</h2>
    <p>Digite um intervalo de até 10 IDs para buscar usuários e produtos:</p>
    <br>
    <label for="inicio">Início:</label>
    <input type="text" id="inicio" placeholder="EX: 1">

    <label for="final">Final:</label>
    <input type="text" id="final" placeholder="EX: 5">
    <br>
    <button id="grafico">Gerar Gráfico</button>

    <h2>Gráfico - Estoque de Produtos</h2>
    <canvas id="graficoProdutos" width="400" height="200"></canvas>

    <h2>Gráfico - Idade de Usuários</h2>
    <canvas id="graficoUsuarios" width="400" height="200"></canvas>
</body>

</html>
